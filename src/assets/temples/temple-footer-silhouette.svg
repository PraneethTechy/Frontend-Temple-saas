<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" preserveAspectRatio="none" fill="none">
  <!-- Subtle distant rolling hills -->
  <path d="M0,105 Q200,85 450,98 T950,90 Q1200,82 1400,95 T1600,88 L1600,120 L0,120 Z" fill="#8C6D46" fill-opacity="0.06"/>
  <path d="M0,110 Q300,98 600,104 T1200,98 Q1400,94 1600,102 L1600,120 L0,120 Z" fill="#8C6D46" fill-opacity="0.08"/>

  <!-- Left Temple Gopuram Cluster -->
