    <path d="M180,115 L184,85 L187,85 L189,72 L192,72 L194,62 L197,62 L198,54 L202,54 L203,62 L206,62 L208,72 L211,72 L213,85 L216,85 L220,115 Z"/>
    <!-- Kalash atop Gopuram 1 -->
    <circle cx="200" cy="50" r="2.5"/>
    <path d="M200,47 L200,43"/>

    <!-- Mandap pavilion -->
    <rect x="225" y="98" width="30" height="17"/>
    <polygon points="222,98 240,88 258,98"/>
