    <path d="M1340,115 C1338,92 1330,82 1315,77 C1330,85 1335,93 1338,115 Z"/>
    <path d="M1340,115 C1342,90 1350,80 1365,75 C1350,83 1345,92 1342,115 Z"/>
    <path d="M1340,115 C1340,86 1340,74 1340,68 C1341,78 1342,90 1340,115 Z"/>

    <!-- Small shrine right -->
    <polygon points="1385,115 1385,100 1420,100 1420,115"/>
    <polygon points="1380,100 1402,90 1425,100"/>
    <circle cx="1402" cy="87" r="2"/>
