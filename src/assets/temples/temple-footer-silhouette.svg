    <line x1="344" y1="65" x2="376" y2="65" stroke="#FAF6EE" stroke-width="1"/>
    <line x1="351" y1="52" x2="369" y2="52" stroke="#FAF6EE" stroke-width="1"/>
    <!-- Kalash cluster -->
    <circle cx="357" cy="36" r="2"/>
    <circle cx="360" cy="34" r="2.5"/>
    <circle cx="363" cy="36" r="2"/>
  </g>

  <!-- Center Gopuram Cluster & Shrines (x=700-900) -->
  <g fill="#8C6D46" fill-opacity="0.14">
