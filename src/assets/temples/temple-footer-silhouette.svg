    <path d="M120,115 C118,95 110,85 95,80 C110,88 115,95 118,115 Z"/>
    <path d="M120,115 C122,92 130,82 145,78 C130,86 125,95 122,115 Z"/>
    <path d="M120,115 C120,88 120,75 120,70 C121,80 122,92 120,115 Z"/>

