    <path d="M765,115 L772,78 L776,78 L780,62 L784,62 L788,48 L792,48 L795,35 L805,35 L808,48 L812,48 L816,62 L820,62 L824,78 L828,78 L835,115 Z"/>
    <!-- 5 Kalash finials -->
    <circle cx="796" cy="31" r="1.8"/>
    <circle cx="798.5" cy="29.5" r="2"/>
    <circle cx="800" cy="28" r="2.5"/>
    <circle cx="801.5" cy="29.5" r="2"/>
    <circle cx="804" cy="31" r="1.8"/>
    <!-- Deepa Stambha pillar (x=855) -->
    <rect x="854" y="65" width="4" height="50"/>
    <polygon points="852,65 856,58 860,65"/>
    <circle cx="856" cy="55" r="2"/>
  </g>

  <!-- Right Temple Architecture & Silhouette (x=1200-1450) -->
  <g fill="#8C6D46" fill-opacity="0.12">
    <!-- Gopuram Right -->
    <path d="M1250,115 L1256,84 L1260,84 L1263,70 L1267,70 L1270,58 L1274,58 L1277,46 L1283,46 L1286,58 L1290,58 L1293,70 L1297,70 L1300,84 L1304,84 L1310,115 Z"/>
    <circle cx="1280" cy="42" r="2.5"/>
