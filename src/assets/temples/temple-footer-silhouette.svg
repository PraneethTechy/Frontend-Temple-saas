    <!-- Grand Gopuram (Center-Left: x=340) -->
    <path d="M330,115 L336,80 L340,80 L343,65 L347,65 L350,52 L354,52 L357,40 L363,40 L366,52 L370,52 L373,65 L377,65 L380,80 L384,80 L390,115 Z"/>
